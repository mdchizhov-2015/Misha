<!DOCTYPE html>
<html>
<head>
    <title>Мое Портфолио</title>
    <style>
        /* Это одежда для сайта — цвета и красота */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff; /* светло-голубой фон */
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #333;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        img {
            width: 150px;
            border-radius: 50%; /* круглая фотка */
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: #e0e0e0;
            margin: 5px;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Тут будет твое фото. Пока просто оставим место -->
        
        
        <h1>Привет! Я — [Твое Имя]</h1>
        <p>Я учусь в 5 классе. Люблю играть в баскетбол и рисовать.</p>

        <h2>Что я умею:</h2>
        <ul>
            <li>⚽ играть в баскетбол</li>
            <li>⚽ Забивать голы</li>
            <li>🎮 Проходить игры</li>
        </ul>

        <h2>Мои проекты:</h2>
        <p>Тут будет мой первый сайт!</p>
    </div>

</body>
</html>
